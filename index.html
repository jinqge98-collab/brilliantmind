<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Flappy Sky Dash</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2329; --muted: #5b636e; --card: #ffffff; --border: #e3e6ea;
    --soft: #f2f4f6; --primary: #3d4b5c; --primary-fg: #ffffff; --ring: #3d4b5c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181b; --fg: #f4f5f6; --muted: #aab1ba; --card: #202327; --border: #34383e;
      --soft: #2a2e33; --primary: #a7b6c9; --primary-fg: #15181c; --ring: #a7b6c9; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .skip { position: absolute; inset-inline-start: -999px; }
  .skip:focus { inset-inline-start: 12px; top: 12px; z-index: 50; background: var(--primary);
    color: var(--primary-fg); padding: 8px 12px; border-radius: 8px; }
  header { border-block-end: 1px solid var(--border); background: var(--card); }
  .bar { max-width: 1100px; margin: 0 auto; height: 56px; display: flex; align-items: center;
    gap: 12px; padding: 0 16px; font-weight: 600; }
  .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--primary);
    display: grid; place-items: center; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; display: flex; gap: 24px;
    flex-wrap: wrap; align-items: flex-start; }
  .game { flex: 1 1 440px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .hud { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 4px 12px;
    font-size: 14px; font-weight: 500; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; }
  .ready { background: #e0f2fe; color: #0c4a6e; } .ready .dot { background: #0284c7; }
  .playing { background: #dcfce7; color: #14532d; } .playing .dot { background: #16a34a; }
  .paused { background: #fef3c7; color: #78350f; } .paused .dot { background: #d97706; }
  .over { background: #fee2e2; color: #7f1d1d; } .over .dot { background: #dc2626; }
  .nums { display: flex; gap: 16px; font-size: 14px; }
  .nums b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .nums span span { color: var(--muted); }
  .stage { position: relative; width: 100%; max-width: 440px; aspect-ratio: 400 / 600;
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer;
    touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
  .stage:focus-visible { box-shadow: 0 0 0 4px color-mix(in srgb, var(--ring) 60%, transparent); }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; }
  .overlay.show { display: flex; }
  #readyOv { justify-content: flex-start; padding-top: 18%; pointer-events: none; }
  #readyOv button { pointer-events: auto; }
  .big { font-size: 36px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 #1d3b52; margin: 0; }
  .dim { background: rgba(0,0,0,.33); }
  .panel { width: 100%; max-width: 280px; background: var(--card); color: var(--fg);
    border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .panel h2 { margin: 0; font-size: 24px; font-weight: 900; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 0; }
  .grid2 div { background: var(--soft); border-radius: 8px; padding: 12px; }
  .grid2 dt { font-size: 12px; font-weight: 500; }
  .grid2 dd { margin: 0; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .newbest { display: none; margin-top: 12px; background: #fef3c7; color: #78350f; border-radius: 999px;
    padding: 4px 12px; font-size: 14px; font-weight: 600; }
  .newbest.show { display: inline-block; }
  button { font: inherit; font-size: 14px; font-weight: 500; border-radius: 8px; padding: 8px 14px;
    border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
  .panel button { width: 100%; margin-top: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  aside { flex: 0 1 280px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  aside h2 { font-size: 14px; margin: 0; }
  aside ol { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
  aside li { display: grid; grid-template-columns: 3.2rem 1fr 2.5rem; gap: 8px; align-items: center; font-size: 14px; }
  .track { height: 10px; background: var(--soft); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: color-mix(in srgb, var(--fg) 40%, transparent); }
  li:first-child .fill { background: var(--primary); }
  .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .s { text-align: end; font-weight: 600; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 14px; margin: 12px 0 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<a class="skip" href="#stage">Skip to game</a>
<header><div class="bar">
  <span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M19 12h3"/><circle cx="14" cy="10" r="1"/></svg></span>
  <span>Flappy Sky Dash</span>
</div></header>
<main class="wrap">
  <section class="game" aria-label="Game">
    <div class="hud">
      <span id="status" class="pill ready"><span class="dot" aria-hidden="true"></span><span id="statusText">Ready</span></span>
      <div class="nums">
        <span><span>Score </span><b id="score">0</b></span>
        <span><span>Best </span><b id="best">0</b></span>
      </div>
    </div>
    <div id="stage" class="stage" tabindex="0">
      <canvas id="c" role="img" aria-label="Flappy bird game"></canvas>
      <div id="readyOv" class="overlay show">
        <p class="big">Get Ready</p>
        <button id="startBtn" class="primary">▶ Start (Space)</button>
      </div>
      <div id="pauseOv" class="overlay dim">
        <p class="big">Paused</p>
        <button id="resumeBtn" class="primary">▶ Resume (P)</button>
      </div>
      <div id="overOv" class="overlay dim">
        <div class="panel" role="dialog" aria-labelledby="overTitle">
          <h2 id="overTitle">Game Over</h2>
          <dl class="grid2">
            <div><dt>Score</dt><dd id="finalScore">0</dd></div>
            <div><dt>Best</dt><dd id="finalBest">0</dd></div>
          </dl>
          <span id="newBest" class="newbest">🏆 New best</span>
          <button id="againBtn" class="primary">↻ Play again (R)</button>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="flapBtn" class="primary">⌃ Flap (Space / ↑)</button>
      <button id="pauseBtn" aria-pressed="false" disabled>❚❚ Pause (P)</button>
      <button id="restartBtn">↻ Restart (R)</button>
    </div>
    <p id="live" class="sr" aria-live="polite"></p>
  </section>
  <aside aria-labelledby="runsH">
    <h2 id="runsH">Recent runs</h2>
    <p id="noRuns" class="empty">No runs yet</p>
    <ol id="runs"></ol>
  </aside>
</main>
<script>
(() => {
  "use strict";
  const W = 400, H = 600, GROUND_H = 80, BIRD_X = 110, BIRD_R = 15;
  const GRAVITY = 1500, FLAP_V = -430, MAX_FALL = 620;
  const PIPE_W = 64, PIPE_SPACING = 210, SPEED_BASE = 150, GAP_START = 170, GAP_MIN = 125;
  const BEST_KEY = "flappy-sky-dash-best";

  const $ = (id) => document.getElementById(id);
  const canvas = $("c"), ctx = canvas.getContext("2d"), stage = $("stage");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr;

  const readBest = () => { try { const v = Number(localStorage.getItem(BEST_KEY)); return v > 0 ? Math.floor(v) : 0; } catch { return 0; } };
  const writeBest = (v) => { try { localStorage.setItem(BEST_KEY, String(v)); } catch {} };

  let best = readBest(), phase = "ready", runs = [], world = fresh();
  $("best").textContent = best;

  function fresh() {
    return { birdY: H * 0.42, vel: 0, pipes: [], groundX: 0, hillX: 0, score: 0, t: 0, flash: 0,
      clouds: [{ x: 40, y: 90, s: 1 }, { x: 220, y: 150, s: 0.7 }, { x: 330, y: 60, s: 0.85 }] };
  }
  const gapFor = (s) => Math.max(GAP_MIN, GAP_START - s * 2);
  const speedFor = (s) => SPEED_BASE + Math.min(90, s * 3);
  function spawnPipe(x, s) {
    const gap = gapFor(s), m = 60, minY = m + gap / 2, maxY = H - GROUND_H - m - gap / 2;
    return { x, gapY: minY + Math.random() * (maxY - minY), gap, scored: false };
  }

  function setPhase(p) {
    phase = p;
    const labels = { ready: "Ready", playing: "Flying", paused: "Paused", over: "Crashed" };
    $("status").className = "pill " + p;
    $("statusText").textContent = labels[p];
    $("readyOv").classList.toggle("show", p === "ready");
    $("pauseOv").classList.toggle("show", p === "paused");
    $("overOv").classList.toggle("show", p === "over");
    const pb = $("pauseBtn");
    pb.disabled = p !== "playing" && p !== "paused";
    pb.setAttribute("aria-pressed", String(p === "paused"));
    pb.textContent = p === "paused" ? "▶ Resume (P)" : "❚❚ Pause (P)";
    $("flapBtn").disabled = p === "paused";
    canvas.setAttribute("aria-label", "Flappy bird game. " + labels[p] + ". Score " + world.score + ".");
  }
  function setScore(v) { $("score").textContent = v; }

  function reset() { world = fresh(); setScore(0); $("live").textContent = ""; setPhase("ready"); stage.focus(); }
  function flap() {
    if (phase === "over") { reset(); return; }
    if (phase === "paused") { setPhase("playing"); return; }
    if (phase === "ready") { world.pipes = [spawnPipe(W + 60, 0)]; setPhase("playing"); }
    world.vel = FLAP_V;
  }
  function togglePause() {
    if (phase === "playing") setPhase("paused"); else if (phase === "paused") setPhase("playing");
  }
  function endRun() {
    world.flash = 0.8;
    const final = world.score, isBest = final > best;
    if (isBest) { best = final; writeBest(best); $("best").textContent = best; }
    $("finalScore").textContent = final; $("finalBest").textContent = best;
    $("newBest").classList.toggle("show", isBest && final > 0);
    const at = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    runs = [{ score: final, at }, ...runs].slice(0, 8);
    renderRuns();
    setPhase("over");
    $("live").textContent = "Game over. Score " + final + ". Best " + best + ".";
    $("againBtn").focus();
  }
  function renderRuns() {
    const ol = $("runs"); ol.textContent = "";
    $("noRuns").style.display = runs.length ? "none" : "";
    const max = Math.max(1, ...runs.map((r) => r.score));
    for (const r of runs) {
      const li = document.createElement("li");
      const t = document.createElement("span"); t.className = "t"; t.textContent = r.at;
      const tr = document.createElement("span"); tr.className = "track"; tr.setAttribute("aria-hidden", "true");
      const f = document.createElement("span"); f.className = "fill"; f.style.display = "block";
      f.style.width = Math.max(4, (r.score / max) * 100) + "%"; tr.appendChild(f);
      const s = document.createElement("span"); s.className = "s"; s.textContent = r.score + (r.score === best && best > 0 ? " 🏆" : "");
      li.append(t, tr, s); ol.appendChild(li);
    }
  }

  function hits(w) {
    if (w.birdY + BIRD_R >= H - GROUND_H) return true;
    if (w.birdY - BIRD_R <= -40) return true;
    for (const p of w.pipes) {
      const nx = Math.max(p.x - 5, Math.min(BIRD_X, p.x + PIPE_W + 5)), dx = BIRD_X - nx;
      if (Math.abs(dx) > BIRD_R) continue;
      const top = p.gapY - p.gap / 2, bottom = p.gapY + p.gap / 2;
      if (w.birdY < top || w.birdY > bottom) return true;
      if (dx * dx + (w.birdY - top) ** 2 < BIRD_R * BIRD_R) return true;
      if (dx * dx + (w.birdY - bottom) ** 2 < BIRD_R * BIRD_R) return true;
    }
    return false;
  }

  function drawPipe(x, y, h, top) {
    if (h <= 0) return;
    const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
    g.addColorStop(0, "#3f9b2f"); g.addColorStop(0.35, "#7bd35b"); g.addColorStop(1, "#2f7a22");
    ctx.fillStyle = g; ctx.fillRect(x, y, PIPE_W, h);
    ctx.lineWidth = 2; ctx.strokeStyle = "#1f5216"; ctx.strokeRect(x, y, PIPE_W, h);
    const capY = top ? y + h - 24 : y;
    ctx.fillRect(x - 5, capY, PIPE_W + 10, 24); ctx.strokeRect(x - 5, capY, PIPE_W + 10, 24);
  }

  function draw(w) {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#5ec4f0"); sky.addColorStop(1, "#bfe9fb");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,236,160,0.9)"; ctx.beginPath(); ctx.arc(320, 110, 34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    for (const c of w.clouds) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 22 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 24 * c.s, c.y - 10 * c.s, 26 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 52 * c.s, c.y, 20 * c.s, 0, Math.PI * 2);
      ctx.fill();
    }
    const base = H - GROUND_H;
    ctx.fillStyle = "#86cf8a";
    for (let i = -1; i < 4; i++) {
      const hx = i * 160 - (w.hillX % 160);
      ctx.beginPath(); ctx.ellipse(hx + 80, base + 10, 110, 60, 0, Math.PI, 0); ctx.fill();
    }
    for (const p of w.pipes) {
      const top = p.gapY - p.gap / 2, bottom = p.gapY + p.gap / 2;
      drawPipe(p.x, 0, top, true); drawPipe(p.x, bottom, base - bottom, false);
    }
    ctx.fillStyle = "#e3c98a"; ctx.fillRect(0, base, W, GROUND_H);
    ctx.fillStyle = "#5aa53d"; ctx.fillRect(0, base, W, 14);
    ctx.fillStyle = "#4a8f31";
    for (let i = -1; i < W / 24 + 2; i++) ctx.fillRect(i * 24 - (w.groundX % 24), base + 14, 12, 6);
    ctx.fillStyle = "#d4b874";
    for (let i = -1; i < W / 40 + 2; i++) ctx.fillRect(i * 40 - (w.groundX % 40), base + 40, 20, 4);

    ctx.save();
    ctx.translate(BIRD_X, w.birdY);
    ctx.rotate(Math.max(-0.5, Math.min(1.2, w.vel / 600)));
    ctx.fillStyle = "#ffcc2e"; ctx.beginPath(); ctx.ellipse(0, 0, BIRD_R + 3, BIRD_R, 0, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#7a5200"; ctx.stroke();
    ctx.fillStyle = "#fff1b8"; ctx.beginPath(); ctx.ellipse(-2, 6, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
    const wing = phase === "playing" || phase === "ready" ? Math.sin(w.t * 22) * 6 : 0;
    ctx.fillStyle = "#f59f0b"; ctx.beginPath();
    ctx.ellipse(-6, 1 - wing / 2, 9, 5 + Math.abs(wing) / 3, -0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(8, -6, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#1f1f1f"; ctx.beginPath(); ctx.arc(10, -6, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ef5a24"; ctx.beginPath(); ctx.moveTo(15, -1); ctx.lineTo(27, 3); ctx.lineTo(15, 8);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();

    if (phase !== "ready") {
      ctx.font = "800 52px system-ui, sans-serif"; ctx.textAlign = "center";
      ctx.lineWidth = 6; ctx.strokeStyle = "#1d3b52"; ctx.strokeText(String(w.score), W / 2, 84);
      ctx.fillStyle = "#fff"; ctx.fillText(String(w.score), W / 2, 84);
    }
    if (w.flash > 0) { ctx.fillStyle = "rgba(255,255,255," + Math.min(0.8, w.flash) + ")"; ctx.fillRect(0, 0, W, H); }
  }

  let last = performance.now();
  function step(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    const w = world;
    if (phase !== "paused") w.t += dt;
    if (w.flash > 0) w.flash = Math.max(0, w.flash - dt * 2.5);
    if (phase === "ready") {
      w.birdY = H * 0.42 + Math.sin(w.t * 3) * 8;
      w.groundX += SPEED_BASE * dt; w.hillX += SPEED_BASE * 0.25 * dt;
    } else if (phase === "playing") {
      const sp = speedFor(w.score);
      w.vel = Math.min(MAX_FALL, w.vel + GRAVITY * dt); w.birdY += w.vel * dt;
      w.groundX += sp * dt; w.hillX += sp * 0.25 * dt;
      for (const p of w.pipes) p.x -= sp * dt;
      const lp = w.pipes[w.pipes.length - 1];
      if (!lp || lp.x < W - PIPE_SPACING) w.pipes.push(spawnPipe((lp ? lp.x : W) + PIPE_SPACING, w.score));
      w.pipes = w.pipes.filter((p) => p.x + PIPE_W > -20);
      for (const p of w.pipes) if (!p.scored && p.x + PIPE_W < BIRD_X - BIRD_R) { p.scored = true; w.score++; setScore(w.score); }
      if (hits(w)) endRun();
    } else if (phase === "over" && w.birdY + BIRD_R < H - GROUND_H) {
      w.vel = Math.min(MAX_FALL, w.vel + GRAVITY * dt);
      w.birdY = Math.min(H - GROUND_H - BIRD_R, w.birdY + w.vel * dt);
    }
    if (phase === "ready" || phase === "playing") {
      const cs = phase === "playing" ? speedFor(w.score) * 0.12 : 10;
      for (const c of w.clouds) { c.x -= cs * dt * c.s; if (c.x < -90) { c.x = W + 20 + Math.random() * 60; c.y = 40 + Math.random() * 160; } }
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(w);
    requestAnimationFrame(step);
  }

  stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    e.preventDefault(); stage.focus(); flap();
  });
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === " " || k === "arrowup" || k === "w") {
      if (e.target.tagName === "BUTTON" && k === " ") return;
      e.preventDefault(); if (!e.repeat) flap();
    } else if (k === "p") togglePause();
    else if (k === "r") reset();
  });
  $("startBtn").addEventListener("click", flap);
  $("resumeBtn").addEventListener("click", () => setPhase("playing"));
  $("againBtn").addEventListener("click", reset);
  $("flapBtn").addEventListener("click", flap);
  $("pauseBtn").addEventListener("click", togglePause);
  $("restartBtn").addEventListener("click", reset);

  setPhase("ready");
  stage.focus();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
